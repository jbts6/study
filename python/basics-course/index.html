<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="本地 30 天 Python 课程，支持 Markdown 阅读、浏览器内运行和学习进度保存。">
  <title>Python 30 天本地课程</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-button" id="menuButton" type="button" aria-controls="courseSidebar" aria-expanded="false">课程目录</button>
    <a class="brand" href="../index.html" aria-label="返回 Python 课程入口">
      <span class="brand-mark" aria-hidden="true">py</span>
      <span>Python 30 天本地课程</span>
    </a>
    <div class="runtime-status" aria-live="polite">
      <span class="status-dot" id="runtimeDot" aria-hidden="true"></span>
      <span id="runtimeStatus">等待课程初始化</span>
    </div>
    <div class="progress-summary" aria-label="课程完成进度">
      <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
      <span id="progressText">0 / 30 天</span>
    </div>
  </header>

  <div class="page-layout">
    <aside class="sidebar" id="courseSidebar" aria-label="课程章节">
      <div class="sidebar-heading">
        <span class="eyebrow">课程章节</span>
        <span class="sidebar-count" id="sidebarCount">30 天</span>
      </div>
      <nav class="lesson-nav" id="lessonNav" aria-label="30 天章节导航"></nav>
      <section class="practice-links" aria-labelledby="practiceHeading">
        <h2 id="practiceHeading">补充练习</h2>
        <a href="https://github.com/trekhleb/learn-python" target="_blank" rel="noreferrer">trekhleb/learn-python</a>
        <a href="https://github.com/gregmalcolm/python_koans" target="_blank" rel="noreferrer">gregmalcolm/python_koans</a>
      </section>
    </aside>
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="关闭课程目录"></button>
    <main class="lesson-main" id="lessonMain" tabindex="-1"></main>
  </div>

  <div class="storage-notice" id="storageNotice" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.9/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js"></script>
  <script src="generated/lessons.js"></script>
  <script src="store.js"></script>
  <script src="runner.js"></script>
  <script src="runner-adapter.js"></script>
  <script src="app.js"></script>
</body>
</html>
