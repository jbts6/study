<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 基础交互课程 · 写给前端开发者</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --border: #30363d;
    --border-dim: #21262d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #6e7681;
    --accent: #58a6ff;
    --py-blue: #3776ab;
    --py-yellow: #ffd43b;
    --analogy: #f0883e;
    --code-bg: #010409;
    --success: #3fb950;
    --error: #f85149;
    --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部栏 */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px; height: 56px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .logo .py-mark {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--py-blue), var(--py-yellow));
    display: grid; place-items: center; font-family: var(--mono); font-weight: 700; color: #fff; font-size: 15px;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); transition: background .3s; }
  .status .dot.ready { background: var(--success); }
  .status .dot.loading { background: var(--py-yellow); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .progress-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .progress-bar { width: 120px; height: 6px; background: var(--border-dim); border-radius: 3px; overflow: hidden; }
  .progress-bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s ease; border-radius: 3px; }
  .progress-text { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .menu-btn { display: none; background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px; }

  /* 布局 */
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 56px); }
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    overflow-y: auto;
    position: sticky; top: 56px;
    height: calc(100vh - 56px);
  }
  .sidebar h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); padding: 0 20px; margin-bottom: 8px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px; cursor: pointer; font-size: 14px; color: var(--text-dim);
    border-left: 2px solid transparent; transition: all .15s;
  }
  .nav-item:hover { background: var(--panel-2); color: var(--text); }
  .nav-item.active { color: var(--text); background: var(--panel-2); border-left-color: var(--accent); }
  .nav-item .num { font-family: var(--mono); font-size: 12px; color: var(--text-faint); width: 22px; }
  .nav-item.active .num { color: var(--accent); }
  .nav-item .check { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); display: grid; place-items: center; flex-shrink: 0; }
  .nav-item.done .check { background: var(--success); border-color: var(--success); }
  .nav-item.done .check::after { content: ''; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); }

  /* 主内容 */
  .main { padding: 40px 48px 120px; max-width: 880px; }
  .lesson-num { font-family: var(--mono); font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .main h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 6px; }
  .main .subtitle { color: var(--text-dim); font-size: 15px; margin-bottom: 28px; }
  .main h2 { font-size: 20px; font-weight: 600; margin: 32px 0 12px; }
  .main p { margin-bottom: 14px; color: #c9d1d9; }
  .main ul, .main ol { margin: 0 0 14px 22px; color: #c9d1d9; }
  .main li { margin-bottom: 6px; }
  .main code { font-family: var(--mono); font-size: 13px; background: var(--panel-2); padding: 2px 6px; border-radius: 4px; color: var(--py-yellow); }
  .main strong { color: var(--text); font-weight: 600; }

  /* 前端类比卡片 */
  .analogy {
    background: var(--panel-2);
    border: 1px solid var(--analogy);
    border-left: 3px solid var(--analogy);
    border-radius: 8px;
    padding: 16px 20px;
    margin: 20px 0;
  }
  .analogy .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--analogy); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .analogy .tag::before { content: ''; width: 14px; height: 14px; border-radius: 3px; background: var(--analogy); opacity: .9; }
  .analogy table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .analogy th { text-align: left; padding: 6px 10px; color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); }
  .analogy td { padding: 7px 10px; border-bottom: 1px solid var(--border-dim); font-family: var(--mono); }
  .analogy td:last-child { color: var(--text-dim); }
  .analogy tr:last-child td { border-bottom: none; }

  /* 代码块 */
  .code-block { margin: 20px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
  .code-block .code-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .code-block .code-head .label { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
  .code-block .code-head .run-btn { background: var(--accent); color: #fff; border: none; border-radius: 5px; padding: 5px 14px; font-size: 13px; cursor: pointer; font-family: var(--sans); display: flex; align-items: center; gap: 6px; transition: opacity .15s; }
  .code-block .code-head .run-btn:hover { opacity: .88; }
  .code-block .code-head .run-btn:disabled { opacity: .5; cursor: not-allowed; }
  .code-block .code-head .run-btn .play { width: 0; height: 0; border-left: 7px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .code-block textarea {
    width: 100%; min-height: 160px; padding: 14px 16px; border: none; background: var(--code-bg);
    color: #c9d1d9; font-family: var(--mono); font-size: 13.5px; line-height: 1.65; resize: none; outline: none; tab-size: 4; white-space: pre; overflow: hidden;
  }
  .code-block .output { padding: 12px 16px; background: var(--code-bg); border-top: 1px solid var(--border); font-family: var(--mono); font-size: 13px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; min-height: 20px; }
  .code-block .output.empty::before { content: '点击运行查看输出…'; color: var(--text-faint); font-style: italic; }
  .code-block .output.err { color: var(--error); }

  /* 练习 */
  .exercise { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px 22px; margin: 24px 0; }
  .exercise .ex-head { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--success); margin-bottom: 10px; }
  .exercise .ex-prompt { margin-bottom: 14px; color: #c9d1d9; }
  .exercise .ex-hint { font-size: 13px; color: var(--text-dim); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }

  /* 完成按钮 + 翻页 */
  .lesson-foot { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .done-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: 14px; transition: all .15s; }
  .done-btn:hover { border-color: var(--success); color: var(--success); }
  .done-btn.checked { background: var(--success); border-color: var(--success); color: #fff; }
  .pager { margin-left: auto; display: flex; gap: 8px; }
  .pager button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; transition: all .15s; }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }

  /* 加载遮罩 */
  .loader-overlay { position: fixed; inset: 0; background: rgba(13,17,23,.92); z-index: 100; display: grid; place-items: center; transition: opacity .4s; }
  .loader-overlay.hide { opacity: 0; pointer-events: none; }
  .loader-box { text-align: center; max-width: 360px; }
  .loader-box .spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--py-yellow); border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-box h3 { font-size: 17px; margin-bottom: 8px; }
  .loader-box p { color: var(--text-dim); font-size: 14px; }

  /* 移动端 */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 56px; width: 280px; z-index: 40; transform: translateX(-100%); transition: transform .25s; }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: block; }
    .main { padding: 24px 18px 100px; }
    .progress-wrap { display: none; }
    .topbar { gap: 10px; padding: 0 14px; }
  }
  .backdrop { display: none; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,.5); z-index: 39; }
  .backdrop.show { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="logo"><div class="py-mark">py</div> Python 基础交互课程</div>
  <div class="status"><span class="dot loading" id="pyDot"></span><span id="pyStatus">加载 Python 运行时…</span></div>
  <div class="progress-wrap">
    <div class="progress-bar"><i id="progBar"></i></div>
    <span class="progress-text" id="progText">0 / 11</span>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h4>课程章节</h4>
    <div id="navList"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main"></main>
</div>

<div class="loader-overlay" id="loader">
  <div class="loader-box">
    <div class="spinner"></div>
    <h3>正在加载 Python 运行时</h3>
    <p>首次加载约需 10-20 秒（下载 Pyodide 解释器），之后可在浏览器内直接运行所有 Python 代码。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
/* ============================================================
   章节数据 —— 每章含讲解、前端类比、可运行示例、练习
   ============================================================ */
const LESSONS = [
  {
    id: 1, title: "变量与数据类型", subtitle: "Python 的基础类型，与 JS 的关键差异",
    body: `
<p>Python 是<strong>动态类型</strong>语言，跟 JavaScript 一样变量无需声明类型。但 Python 的类型系统更严格——没有隐式类型转换的"魔法"。</p>
<h2>四种基础类型</h2>
<ul>
<li><code>int</code> 整数 —— 注意：Python 的 int 是<strong>任意精度</strong>的，不会溢出，不像 JS 的 Number 受 64 位浮点限制</li>
<li><code>float</code> 浮点数 —— 对应 JS 的 Number</li>
<li><code>str</code> 字符串 —— 对应 JS 的 string，但 Python 没有单字符 char 类型，单个字符就是长度 1 的 str</li>
<li><code>bool</code> 布尔 —— 注意首字母大写：<code>True</code> / <code>False</code>，不是 JS 的 <code>true</code> / <code>false</code></li>
</ul>
<p>用 <code>type()</code> 查看类型，对标 JS 的 <code>typeof</code>。Python 没有 <code>===</code>，比较运算符直接判断类型和值。</p>
`,
    analogy: {
      rows: [
        ["let x = 1", "x = 1", "都无需声明类型"],
        ["typeof x", "type(x)", "查看类型"],
        ["true / false", "True / False", "Python 首字母大写"],
        ["null / undefined", "None", "Python 只有 None"],
        ["Number(任意精度有限)", "int(任意精度)", "Python 的大整数不会溢出"],
      ]
    },
    example: `# 变量赋值 —— 无需声明类型
age = 25
name = "前端转后端"
height = 1.75
is_dev = True

# 用 type() 查看类型
print(type(age))     # <class 'int'>
print(type(name))    # <class 'str'>
print(type(is_dev))  # <class 'bool'>

# Python 的整数不会溢出
big = 2 ** 100
print(big)  # 一个 31 位数，JS 里会变成 Infinity

# 类型转换 —— 显式，不会自动转换
print(int("42"))      # 字符串转整数
print(str(42))        # 整数转字符串
print(float("3.14"))  # 字符串转浮点`,
    exercise: {
      prompt: "创建变量 city 存储你的城市名（字符串），population 存储人口数（整数），is_capital 存储是否首都（布尔值）。然后用 print 分别输出它们的类型。",
      starter: `# 在下面写你的代码
city = 
population = 
is_capital = 

# 输出类型
print(type(city))`,
      hint: "字符串用引号包裹，布尔值首字母大写 True/False，整数直接写数字。"
    }
  },
  {
    id: 2, title: "字符串", subtitle: "f-string 格式化、切片与常用方法",
    body: `
<p>Python 字符串比 JS 更"重"——它是<strong>不可变</strong>的（跟 JS 一样），但方法更丰富。最值得掌握的是 <strong>f-string</strong>，比 JS 的模板字符串还方便。</p>
<h2>三个核心操作</h2>
<ol>
<li><strong>f-string 格式化</strong>：<code>f"Hello {name}"</code>，对标 JS 的反引号模板字符串 <code>\`Hello ${name}\`</code></li>
<li><strong>切片</strong>：<code>s[1:4]</code> 取子串，Python 的切片比 JS 的 <code>substring</code> 强大且统一（列表也能用）</li>
<li><strong>常用方法</strong>：<code>.upper()</code> <code>.lower()</code> <code>.split()</code> <code>.strip()</code> <code>.replace()</code></li>
</ol>
<p>注意：Python 字符串方法返回<strong>新字符串</strong>（原串不变），这跟 JS 一致。但 Python 没有 <code>.includes()</code>，用 <code>in</code> 关键字：<code>"a" in s</code>。</p>
`,
    analogy: {
      rows: [
        ["`Hello ${name}`", 'f"Hello {name}"', "模板字符串 vs f-string"],
        ["s.substring(1,4)", "s[1:4]", "切片语法更简洁"],
        ["s.includes('a')", "'a' in s", "用 in 关键字"],
        ["s.split(',')", "s.split(',')", "完全一致"],
        ["s.length", "len(s)", "属性 vs 函数"],
      ]
    },
    example: `# f-string —— 比模板字符串更强
name = "Python"
version = 3.12
print(f"当前 {name} 版本 {version}")  # 当前 Python 版本 3.12

# f-string 支持表达式
price = 99.5
count = 3
print(f"总价: {price * count} 元")  # 总价: 298.5 元
print(f"打折后: {price * count * 0.8:.2f} 元")  # 保留两位小数

# 切片 —— start:stop:step，stop 不包含
s = "Hello, World"
print(s[0:5])    # Hello
print(s[-6:])    # World（负数从末尾数）
print(s[::-1])   # 反转字符串

# 常用方法
print("  hello  ".strip())       # 去首尾空格 -> hello
print("a,b,c".split(","))        # 分割 -> ['a', 'b', 'c']
print("-".join(["2024","01","15"]))  # 拼接 -> 2024-01-15
print("abc" in "xxabcyy")        # 包含判断 -> True`,
    exercise: {
      prompt: "给定邮箱字符串 email = 'user@example.com'，用字符串方法提取出用户名（@ 前部分）和域名（@ 后部分），用 f-string 输出 '用户名: xxx, 域名: xxx'。",
      starter: `email = "user@example.com"

# 提取用户名和域名（提示：用 split）
parts = email.split("@")
username = 
domain = 

# 用 f-string 输出
print(f"用户名: {}, 域名: {}")`,
      hint: "split('@') 返回列表，parts[0] 是用户名，parts[1] 是域名。f-string 里用 {username} {domain}。"
    }
  },
  {
    id: 3, title: "列表 list", subtitle: "Python 的主力数据结构，对应 JS 数组",
    body: `
<p>列表是 Python 用得最多的数据结构，直接对应 JS 的 Array。但有几个关键差异要记住。</p>
<h2>核心差异</h2>
<ul>
<li><strong>可混合类型</strong>：Python 列表能放任意类型 <code>[1, "a", True]</code>，但实际开发中通常放同类型</li>
<li><strong>切片是利器</strong>：<code>lst[1:3]</code> 取子列表，JS 数组没有这个语法（要用 <code>.slice()</code>）</li>
<li><strong>负索引</strong>：<code>lst[-1]</code> 取最后一个元素，JS 不支持负索引（会返回 undefined）</li>
<li><strong>没有 map/filter</strong>：Python 用列表推导式（第 9 课）替代，更简洁</li>
</ul>
<h2>常用方法</h2>
<p><code>.append()</code> 尾部添加（对应 JS <code>.push()</code>）、<code>.pop()</code> 弹出、<code>.insert()</code> 插入、<code>.sort()</code> 排序、<code>len()</code> 长度（不是 <code>.length</code> 属性，是函数）。</p>
`,
    analogy: {
      rows: [
        ["[1, 2, 3]", "[1, 2, 3]", "语法一致"],
        ["arr.length", "len(lst)", "属性 vs 函数"],
        ["arr.push(x)", "lst.append(x)", "方法名不同"],
        ["arr[arr.length-1]", "lst[-1]", "负索引更方便"],
        ["arr.slice(1,3)", "lst[1:3]", "切片语法"],
        ["arr.map(x=>x*2)", "[x*2 for x in lst]", "推导式替代 map"],
      ]
    },
    example: `# 创建列表
nums = [10, 20, 30, 40, 50]
fruits = ["apple", "banana", "cherry"]
mixed = [1, "two", 3.0, True]  # 可以混合，但不推荐

# 索引与切片
print(nums[0])     # 10（第一个）
print(nums[-1])    # 50（最后一个，负索引）
print(nums[1:4])   # [20, 30, 40]（切片）
print(nums[::2])   # [10, 30, 50]（步长为2）

# 增删改
nums.append(60)       # 尾部添加
nums.insert(0, 5)     # 指定位置插入
nums[0] = 99          # 修改元素
print(nums)           # [99, 20, 30, 40, 50, 60]

# 遍历
for fruit in fruits:
    print(fruit)

# 判断包含
print("banana" in fruits)  # True

# 长度
print(len(fruits))  # 3`,
    exercise: {
      prompt: "创建列表 scores = [88, 92, 75, 96, 83]。求：最高分、最低分、平均分（保留1位小数）。提示：用 max()、min()、sum()、len()。",
      starter: `scores = [88, 92, 75, 96, 83]

highest = 
lowest = 
average = 

print(f"最高分: {highest}")
print(f"最低分: {lowest}")
print(f"平均分: {average:.1f}")`,
      hint: "max(scores) 求最大，min(scores) 求最小，sum(scores)/len(scores) 求平均。"
    }
  },
  {
    id: 4, title: "字典与元组", subtitle: "dict 键值对 + tuple 不可变序列",
    body: `
<p>字典是 Python 的<strong>键值对</strong>结构，直接对应 JS 的 Object / Map。元组是不可变序列，JS 没有直接对应物。</p>
<h2>字典 dict</h2>
<ul>
<li>对标 JS 的 Object，但语法用花括号 <code>{}</code>，键不必加引号也能写但<strong>键必须是字符串时会加引号</strong></li>

/* ============================================================
   Pyodide 初始化
   ============================================================ */
let pyodide = null;
let pyodideReady = false;

async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    await pyodide.loadPackage("beautifulsoup4");
    pyodideReady = true;
    document.getElementById('pyDot').className = 'dot ready';
    document.getElementById('pyStatus').textContent = 'Python 已就绪';
    document.getElementById('loader').classList.add('hide');
  } catch (e) {
    document.getElementById('pyDot').className = 'dot';
    document.getElementById('pyStatus').textContent = '加载失败，请刷新重试';
    console.error(e);
  }
}

async function runCode(code, outputEl) {
  if (!pyodideReady) {
    outputEl.textContent = 'Python 运行时还在加载，请稍候…';
    outputEl.className = 'output err';
    return;
  }
  outputEl.textContent = '运行中…';
  outputEl.className = 'output';
  try {
    const wrapped = `
import sys, io, traceback
_old = sys.stdout
sys.stdout = io.StringIO()
_err = None
try:
    exec(${JSON.stringify(code)})
except Exception:
    _err = traceback.format_exc()
_out = sys.stdout.getvalue()
sys.stdout = _old
_out + (_err if _err else "")
`;
    const result = pyodide.runPython(wrapped);
    outputEl.textContent = result || '(无输出)';
  } catch (e) {
    outputEl.textContent = String(e.message || e);
    outputEl.className = 'output err';
  }
}

/* ============================================================
   渲染逻辑
   ============================================================ */
let currentLesson = 0;
const STORAGE_KEY = 'py-course-progress';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {}
}
let progress = loadProgress();

function renderNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = LESSONS.map((l, i) => `
    <div class="nav-item ${i === currentLesson ? 'active' : ''} ${progress[l.id] ? 'done' : ''}" data-idx="${i}">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span>${l.title}</span>
      <span class="check"></span>
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      currentLesson = parseInt(el.dataset.idx);
      renderNav();
      renderLesson();
      closeSidebar();
      window.scrollTo(0, 0);
    });
  });
  updateProgressBar();
}

function updateProgressBar() {
  const done = LESSONS.filter(l => progress[l.id]).length;
  const pct = (done / LESSONS.length) * 100;
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('progText').textContent = `${done} / ${LESSONS.length}`;
}

function renderLesson() {
  const l = LESSONS[currentLesson];
  const main = document.getElementById('main');
  const analogyHtml = l.analogy.rows.map(r =>
    `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`
  ).join('');

  main.innerHTML = `
    <div class="lesson-num">第 ${String(currentLesson+1).padStart(2,'0')} 课 / 共 ${LESSONS.length} 课</div>
    <h1>${l.title}</h1>
    <p class="subtitle">${l.subtitle}</p>
    ${l.body}
    <div class="analogy">
      <div class="tag">前端类比对照</div>
      <table>
        <tr><th>JavaScript</th><th>Python</th><th>说明</th></tr>
        ${analogyHtml}
      </table>
    </div>
    <h2>可运行示例</h2>
    ${codeBlock(l.example, '示例代码')}
    <h2>动手练习</h2>
    <div class="exercise">
      <div class="ex-head">练习题</div>
      <div class="ex-prompt">${l.exercise.prompt}</div>
      ${codeBlock(l.exercise.starter, '你的代码')}
      <div class="ex-hint">提示：${l.exercise.hint}</div>
    </div>
    <div class="lesson-foot">
      <button class="done-btn ${progress[l.id] ? 'checked' : ''}" id="doneBtn">
        ${progress[l.id] ? '✓ 已完成' : '标记完成'}
      </button>
      <div class="pager">
        <button id="prevBtn" ${currentLesson === 0 ? 'disabled' : ''}>← 上一课</button>
        <button id="nextBtn" ${currentLesson === LESSONS.length-1 ? 'disabled' : ''}>下一课 →</button>
      </div>
    </div>
  `;
  bindLessonEvents(l);
}

function codeBlock(code, label) {
  const id = 'cb_' + Math.random().toString(36).slice(2, 9);
  return `
    <div class="code-block">
      <div class="code-head">
        <span class="label">${label}</span>
        <button class="run-btn" data-target="${id}"><span class="play"></span>运行</button>
      </div>
      <textarea id="${id}" spellcheck="false">${code.replace(/</g,'&lt;')}</textarea>
      <div class="output empty" id="${id}_out"></div>
    </div>
  `;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.max(160, el.scrollHeight + 4) + 'px';
}

function bindLessonEvents(l) {
  document.querySelectorAll('.code-block textarea').forEach(ta => {
    autoResize(ta);
    ta.addEventListener('input', () => autoResize(ta));
  });
  document.querySelectorAll('.run-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.target;
      const code = document.getElementById(id).value;
      const out = document.getElementById(id + '_out');
      out.classList.remove('empty');
      btn.disabled = true;
      await runCode(code, out);
      btn.disabled = false;
    });
  });
  document.getElementById('doneBtn').addEventListener('click', () => {
    if (progress[l.id]) {
      delete progress[l.id];
    } else {
      progress[l.id] = true;
    }
    saveProgress(progress);
    renderNav();
    renderLesson();
  });
  document.getElementById('prevBtn')?.addEventListener('click', () => {
    if (currentLesson > 0) { currentLesson--; renderNav(); renderLesson(); window.scrollTo(0,0); }
  });
  document.getElementById('nextBtn')?.addEventListener('click', () => {
    if (currentLesson < LESSONS.length-1) { currentLesson++; renderNav(); renderLesson(); window.scrollTo(0,0); }
  });
}

/* 侧边栏移动端 */
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
});
document.getElementById('backdrop').addEventListener('click', closeSidebar);

/* 启动 */
renderNav();
renderLesson();
initPyodide();
</script>
